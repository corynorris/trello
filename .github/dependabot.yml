# Grouped, low-noise dependency updates: one PR per group per month, minors and
# patches only. Major bumps are ignored on purpose (the apps are migrated
# deliberately); Dependabot security updates still open PRs when an advisory
# needs an out-of-range fix.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/assets"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
